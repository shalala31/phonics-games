<!DOCTYPE html>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Noto+Sans+TC:wght@400;600;700;900&display=swap');
    body {
      font-family: 'Noto Sans TC', sans-serif;
      background: radial-gradient(circle at top, #0284c7, #0369a1, #0c4a6e);
      min-height: 100vh;
    }
    .game-font {
      font-family: 'Fredoka One', 'Noto Sans TC', cursive, sans-serif;
    }

    /* 輪子轉動 */
    .train-wheel {
      animation: rotateWheel 2s linear infinite;
      transform-origin: center;
    }
    @keyframes rotateWheel {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* 煙囪冒煙 */
    .smoke-puff {
      animation: smokeRise 2s ease-out infinite;
      opacity: 0;
    }
    @keyframes smokeRise {
      0% { transform: translateY(0) scale(0.6); opacity: 0.8; }
      50% { opacity: 0.5; }
      100% { transform: translateY(-40px) translateX(-20px) scale(1.6); opacity: 0; }
    }

    /* 車廂跳動 */
    .cart-bounce {
      animation: cartHop 0.4s ease-in-out;
    }
    @keyframes cartHop {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
  </style>
</head>

      { word: "hug", letters: ["h", "u", "g"], vowel: "u", emoji: "🤗" },
      { word: "mug", letters: ["m", "u", "g"], vowel: "u", emoji: "🥛" },
      { word: "jug", letters: ["j", "u", "g"], vowel: "u", emoji: "🏺" },
      { word: "rug", letters: ["r", "u", "g"], vowel: "u", emoji: "🧶" },
      { word: "tub", letters: ["t", "u", "b"], vowel: "u", emoji: "🛁" },
      { word: "sub", letters: ["s", "u", "b"], vowel: "u", emoji: "🥪" },
      { word: "rub", letters: ["r", "u", "b"], vowel: "u", emoji: "🧼" },
      { word: "mud", letters: ["m", "u", "d"], vowel: "u", emoji: "🪵" },
      { word: "cut", letters: ["c", "u", "t"], vowel: "u", emoji: "✂️" },
      { word: "nut", letters: ["n", "u", "t"], vowel: "u", emoji: "🥜" },
      { word: "hut", letters: ["h", "u", "t"], vowel: "u", emoji: "🛖" }
    ];

    // ================= 音訊合成引擎 =================
    let audioCtx = null;
    function initAudio() {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
      } catch (e) {}
    }

    function playTone(freq, type = 'sine', duration = 0.15, vol = 0.15) {
      initAudio();
      if (!audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(vol, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    // 火車鳴笛音效 (Toot-Toot!)
    function playTrainWhistle() {
      initAudio();
      if (!audioCtx) return;
      const playChime = (timeOffset) => {
        setTimeout(() => {
          [587.33, 880.00].forEach(f => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(f, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.35);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.35);
          });
        }, timeOffset);
      };
      playChime(0);
      playChime(220);
    }

    // 播放整字
    function playWholeWord() {
      if (!currentTarget) return;
      try {
        if (!('speechSynthesis' in window)) return;
        window.speechSynthesis.resume();
        window.speechSynthesis.cancel();

        const utter = new SpeechSynthesisUtterance(currentTarget.word);
        utter.lang = 'en-US';
        utter.rate = 0.85;
        window.speechSynthesis.speak(utter);
      } catch (e) {}
    }

    // 慢速分音 Blending (/c/ ... /a/ ... /t/ -> cat!)
    function playSegmentedSounds() {
      if (!currentTarget) return;
      try {
        if (!('speechSynthesis' in window)) return;
        window.speechSynthesis.resume();
        window.speechSynthesis.cancel();

        const lts = currentTarget.letters;
        let delay = 0;

        lts.forEach((letter, i) => {
          setTimeout(() => {
            const u = new SpeechSynthesisUtterance(letter);
            u.lang = 'en-US';
            u.rate = 0.75;
            u.pitch = 1.1;
            window.speechSynthesis.speak(u);
            playTone(350 + i * 80, 'sine', 0.1, 0.1);
          }, delay);
          delay += 550;
        });

        // 最後融合完整讀出
        setTimeout(() => {
          const finalU = new SpeechSynthesisUtterance(currentTarget.word);
          finalU.lang = 'en-US';
          finalU.rate = 0.85;
          window.speechSynthesis.speak(finalU);
          playTone(650, 'triangle', 0.2, 0.15);
        }, delay + 200);

      } catch (e) {}
    }

    function shuffle(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    // ================= 遊戲核心邏輯 =================
    let currentMode = 'first'; // 'first', 'last', 'middle', 'all'
    let currentRound = 0;
    let score = 0;
    let currentTarget = null;
    let shuffledDeck = [];

    // 使用者填入狀態 (3格)
    let userSlots = ["", "", ""];
    let lockedSlots = [false, false, false]; // 哪些格是系統預先給予的
    let questionSolved = false;

    function setMode(mode) {
      currentMode = mode;
      ['first', 'last', 'middle', 'all'].forEach(m => {
        const btn = document.getElementById(`mode-btn-${m}`);
        if (m === mode) {
          btn.className = "px-2.5 py-1.5 rounded-xl text-xs font-black transition border border-amber-400 bg-amber-500 text-slate-950 shadow";
        } else {
          btn.className = "px-2.5 py-1.5 rounded-xl text-xs font-bold transition border border-slate-700 bg-slate-800 text-slate-300 hover:text-white";
        }
      });
      resetGame();
    }

    function resetGame() {
      shuffledDeck = shuffle([...cvc100Words]);
      currentRound = 0;
      score = 0;
      document.getElementById('score-text').textContent = score;
      document.getElementById('victory-modal').classList.add('hidden');
      setupRound();
    }

    function setupRound() {
      if (currentRound >= shuffledDeck.length) {
        document.getElementById('victory-modal').classList.remove('hidden');
        playTrainWhistle();
        return;
      }

      questionSolved = false;
      currentTarget = shuffledDeck[currentRound];
      userSlots = ["", "", ""];
      lockedSlots = [false, false, false];

      document.getElementById('progress-text').textContent = `第 ${currentRound + 1} / ${shuffledDeck.length} 題`;
      document.getElementById('vowel-badge').textContent = `短母音 ${currentTarget.vowel.toUpperCase()}`;
      
      const feedback = document.getElementById('feedback-box');
      feedback.classList.add('hidden');
      document.getElementById('next-btn').classList.add('hidden');

      // 根據關卡決定哪幾格預先填好
      if (currentMode === 'first') {
        // 考第 1 格 (首音)，第 2, 3 格預先填好
        userSlots[1] = currentTarget.letters[1];
        userSlots[2] = currentTarget.letters[2];
        lockedSlots[1] = true;
        lockedSlots[2] = true;
      } else if (currentMode === 'last') {
        // 考第 3 格 (尾音)，第 1, 2 格預先填好
        userSlots[0] = currentTarget.letters[0];
        userSlots[1] = currentTarget.letters[1];
        lockedSlots[0] = true;
        lockedSlots[1] = true;
      } else if (currentMode === 'middle') {
        // 考第 2 格 (短母音)，第 1, 3 格預先填好
        userSlots[0] = currentTarget.letters[0];
        userSlots[2] = currentTarget.letters[2];
        lockedSlots[0] = true;
        lockedSlots[2] = true;
      } else if (currentMode === 'all') {
        // 全拼大魔王，3 格全部空白
        // lockedSlots 全部維持 false
      }

      renderTrainSlots();
      generateChoices();

      // 自動播一次整字
      setTimeout(() => {
        playWholeWord();
      }, 350);
    }

    function renderTrainSlots() {
      for (let i = 0; i < 3; i++) {
        const slotEl = document.getElementById(`slot-${i}`);
        const val = userSlots[i];
        
        if (val !== "") {
          slotEl.textContent = val;
          slotEl.classList.remove('border-dashed');
          slotEl.classList.add('border-solid');
          if (lockedSlots[i]) {
            slotEl.className = "w-18 h-22 sm:w-24 sm:h-28 rounded-2xl border-4 border-solid border-slate-600 bg-slate-800/60 flex items-center justify-center text-4xl sm:text-6xl font-black text-slate-300 shadow-inner";
          } else {
            slotEl.className = "w-18 h-22 sm:w-24 sm:h-28 rounded-2xl border-4 border-solid border-emerald-400 bg-emerald-950/80 flex items-center justify-center text-4xl sm:text-6xl font-black text-emerald-300 shadow-xl cursor-pointer hover:scale-105 transition";
          }
        } else {
          slotEl.textContent = "?";
          slotEl.classList.add('border-dashed');
          slotEl.classList.remove('border-solid');
          slotEl.className = `w-18 h-22 sm:w-24 sm:h-28 rounded-2xl border-4 border-dashed ${i === 0 ? 'border-amber-400 text-amber-300' : i === 1 ? 'border-rose-400 text-rose-300' : 'border-sky-400 text-sky-300'} bg-slate-800/90 flex items-center justify-center text-4xl sm:text-6xl font-black shadow-xl cursor-pointer`;
        }
      }
    }

    // 產生候選字母按鈕 (包含正確解答與干擾項)
    function generateChoices() {
      const choicesContainer = document.getElementById('choices-container');
      choicesContainer.innerHTML = '';

      let neededLetters = [];
      for (let i = 0; i < 3; i++) {
        if (!lockedSlots[i]) {
          neededLetters.push(currentTarget.letters[i]);
        }
      }

      // 挑選干擾字母
      const alphabet = "abcdefghijklmnopqrstuvwxyz".split("");
      let candidatePool = [...neededLetters];

      while (candidatePool.length < 5) {
        const randL = alphabet[Math.floor(Math.random() * alphabet.length)];
        if (!candidatePool.includes(randL)) {
          candidatePool.push(randL);
        }
      }

      const shuffledChoices = shuffle(candidatePool);

      shuffledChoices.forEach((letter) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = "w-14 h-14 sm:w-16 sm:h-16 rounded-2xl bg-gradient-to-tr from-slate-700 to-slate-800 hover:from-amber-500 hover:to-amber-600 hover:text-slate-950 border-2 border-slate-600 hover:border-white text-white font-black text-2xl sm:text-3xl shadow-xl transition active:scale-95 flex items-center justify-center cursor-pointer";
        btn.textContent = letter;
        btn.onclick = () => handleChoiceClick(letter, btn);
        choicesContainer.appendChild(btn);
      });
    }

    // 點擊候選字母：自動填入第一個未鎖定且空白的格子
    function handleChoiceClick(letter, btnEl) {
      if (questionSolved) return;
      initAudio();

      let targetIdx = -1;
      for (let i = 0; i < 3; i++) {
        if (!lockedSlots[i] && userSlots[i] === "") {
          targetIdx = i;
          break;
        }
      }

      if (targetIdx !== -1) {
        userSlots[targetIdx] = letter;
        playTone(450 + targetIdx * 70, 'sine', 0.1, 0.15);
        renderTrainSlots();
        checkAnswer();
      }
    }

    // 點擊車廂上的字母：取下重選
    function removeLetter(idx) {
      if (questionSolved) return;
      if (lockedSlots[idx]) return; // 鎖定格不能拿
      if (userSlots[idx] === "") return;

      playTone(280, 'sawtooth', 0.08, 0.1);
      userSlots[idx] = "";
      renderTrainSlots();
    }

    // 檢查是否拼對
    function checkAnswer() {
      // 檢查是否 3 格都填滿了
      for (let i = 0; i < 3; i++) {
        if (userSlots[i] === "") return;
      }

      const isCorrect = (
        userSlots[0] === currentTarget.letters[0] &&
        userSlots[1] === currentTarget.letters[1] &&
        userSlots[2] === currentTarget.letters[2]
      );

      const feedback = document.getElementById('feedback-box');

      if (isCorrect) {
        questionSolved = true;
        score += 10;
        document.getElementById('score-text').textContent = score;

        playTrainWhistle();

        // 車廂彈跳動畫
        for (let i = 0; i < 3; i++) {
          document.getElementById(`slot-${i}`).classList.add('cart-bounce');
        }

        feedback.className = "p-3.5 rounded-2xl text-xs sm:text-sm font-semibold my-3 leading-relaxed bg-emerald-950/80 border border-emerald-500 text-emerald-200 block text-center";
        feedback.innerHTML = `
          <div class="text-3xl mb-1">${currentTarget.emoji}</div>
          <i class="fa-solid fa-circle-check text-emerald-400 mr-1.5"></i>
          <strong>太棒了，拼對了！汽笛響起 Toot-Toot！</strong>
          正確單字是【<strong>${currentTarget.word.toUpperCase()}</strong>】！
        `;

        document.getElementById('next-btn').classList.remove('hidden');

      } else {
        playTone(200, 'sawtooth', 0.25, 0.2);

        feedback.className = "p-3.5 rounded-2xl text-xs sm:text-sm font-semibold my-3 leading-relaxed bg-rose-950/80 border border-rose-500 text-rose-200 block text-center";
        feedback.innerHTML = `
          <i class="fa-solid fa-circle-xmark text-rose-400 mr-1.5"></i>
          <strong>聲音不太一樣喔！點擊車廂上的字母拿下來再試一次！</strong>
        `;
      }
    }

    function nextQuestion() {
      currentRound++;
      setupRound();
    }

    // 頁面加載即刻開始
    window.addEventListener('DOMContentLoaded', () => {
      resetGame();
    });
  </script>
